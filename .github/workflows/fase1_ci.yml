name: Phase 1 and 2 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  phases:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar código y pruebas
        run: |
          python -m compileall -q src/churnshield experiments tests/fase1 tests/fase2 tests/experiments

      - name: Ejecutar pruebas
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/fase1 tests/fase2 tests/experiments

      - name: Probar escenario S03 de Fase 1
        env:
          PYTHONPATH: src
        run: |
          python -m churnshield run --scenario S03
