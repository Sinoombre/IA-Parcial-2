name: Phase 1 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  phase1:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar código
        run: |
          python -m compileall -q churnshield tests

      - name: Ejecutar S03
        run: |
          python -m churnshield run \
            --scenario S03 \
            --config config/agente.yaml

      - name: Ejecutar pruebas
        run: |
          python -m pytest -q tests

      - name: Verificar que el EDA no cambió
        run: |
          test "$(sha256sum data/EDA.ipynb | cut -d ' ' -f 1)" = \
          "e7242422ab7051bfddb5dae19007308d4ddbc05babbaf43bec663b5e7bc73d77"