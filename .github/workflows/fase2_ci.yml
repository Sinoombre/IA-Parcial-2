name: Phase 2 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  phase2:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar código
        run: |
          python -m compileall -q src/churnshield tests

      - name: Ejecutar pruebas de Fase 1 y Fase 2
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests

      - name: Ejecutar evaluación de desarrollo
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: ignore
        run: |
          python -m churnshield dev-eval

      - name: Comparar arreglos de linealidad y multicolinealidad
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: ignore
        run: |
          python -m churnshield.phase2_fixes


      - name: Proteger el EDA oficial de main
        run: |
          test "$(sha256sum data/EDA.ipynb | cut -d ' ' -f 1)" = \
          "e7242422ab7051bfddb5dae19007308d4ddbc05babbaf43bec663b5e7bc73d77"
