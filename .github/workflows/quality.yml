name: Code quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Check lint
        run: python -m ruff check src tests experiments

      - name: Check formatting
        run: python -m ruff format --check src/churnshield/scenarios src/churnshield/simulation tests/scenarios tests/simulation
