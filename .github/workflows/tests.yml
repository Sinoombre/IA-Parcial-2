name: Tests and CLI checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar código y pruebas
        run: |
          python -m compileall -q src/churnshield experiments tests

      - name: Ejecutar pruebas
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

      - name: Probar escenario S03 del agente
        env:
          PYTHONPATH: src
        run: |
          python -m churnshield run --scenario S03

      - name: Probar escenario S02 de retención
        env:
          PYTHONPATH: src
        run: |
          python -m churnshield scenarios --scenario S02 --seed 101
